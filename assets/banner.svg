<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a192f"/><stop offset="50%" stop-color="#112240"/><stop offset="100%" stop-color="#0d2538"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00e676"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes chartPulse{0%{opacity:.3;transform:scaleY(.98)}50%{opacity:.7;transform:scaleY(1.02)}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.2}50%{transform:translateY(-15px);opacity:.8}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,-apple-system,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#8892b0}.badge-text{font-weight:600;font-size:14px;fill:#64ffda}.animated-bg-line{stroke-dasharray:10,15;animation:lineDash 30s linear infinite}.candlestick-group{animation:chartPulse 4s ease-in-out infinite;transform-origin:center}.particle{animation:floatParticle 5s ease-in-out infinite}</style><rect width="1200" height="350" fill="url(#bgGrad)" rx="15"/><g stroke="#233554" stroke-width="1" opacity=".4"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="200" x2="200" y1="0" y2="350"/><line x1="400" x2="400" y1="0" y2="350"/><line x1="600" x2="600" y1="0" y2="350"/><line x1="800" x2="800" y1="0" y2="350"/><line x1="1000" x2="1000" y1="0" y2="350"/></g><g class="candlestick-group" opacity=".35"><line x1="850" x2="850" y1="120" y2="280" stroke="#00e6