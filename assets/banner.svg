<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#112240" />
      <stop offset="100%" stop-color="#0d2538" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <!-- Candlestick Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #8892b0;
    }
    .badge-text {
      font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #64ffda;
    }
    
    /* Dynamic Animations */
    @keyframes chartPulse {
      0% { opacity: 0.3; transform: scaleY(0.98); }
      50% { opacity: 0.7; transform: scaleY(1.02); }
      100% { opacity: 0.3; transform: scaleY(0.98); }
    }
    @keyframes lineDash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(-15px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }

    .animated-bg-line {
      stroke-dasharray: 10, 15;
      animation: lineDash 30s linear infinite;
    }
    .candlestick-group {
      animation: chartPulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="15" fill="url(#bgGrad)" />

  <!-- Grid Lines Pattern (Dynamic Background) -->
  <g stroke="#233554" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Dynamic Background Chart Elements (Subtle & In Background) -->
  <g class="candlestick-group" opacity="0.35">
    <!-- Green Bullish Candlesticks -->
    <line x1="850" y1="120" x2="850" y2="280" stroke="#00e676" stroke-width="2" />
    <rect x="840" y="160" width="20" height="80" fill="#00e676" rx="3" />

    <line x1="930" y1="80" x2="930" y2="250" stroke="#00e676" stroke-width="2" />
    <rect x="920" y="110" width="20" height="110" fill="#00e676" rx="3" />

    <line x1="1010" y1="60" x2="1010" y2="220" stroke="#00e676" stroke-width="2" />
    <rect x="1000" y="80" width="20" height="90" fill="#00e676" rx="3" />

    <!-- Red Bearish Candlesticks -->
    <line x1="890" y1="140" x2="890" y2="290" stroke="#ff5252" stroke-width="2" />
    <rect x="880" y="170" width="20" height="90" fill="#ff5252" rx="3" />

    <line x1="970" y1="100" x2="970" y2="260" stroke="#ff5252" stroke-width="2" />
    <rect x="960" y="130" width="20" height="70" fill="#ff5252" rx="3" />
  </g>

  <!-- Animated Trend Wave Line -->
  <path d="M 50 260 Q 250 300 450 200 T 850 150 T 1150 70" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.5" class="animated-bg-line" filter="url(#glow)" />

  <!-- Floating Particles -->
  <circle cx="150" cy="120" r="4" fill="#64ffda" class="particle" style="animation-delay: 0s;" />
  <circle cx="750" cy="80" r="3" fill="#00f2fe" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="1100" cy="220" r="5" fill="#00e676" class="particle" style="animation-delay: 3s;" />

  <!-- Foreground Content Container (Ensures Text & Titles are Always Visible & Crisp) -->
  <g transform="translate(60, 0)">
    <!-- Decorative Icon Tag -->
    <rect x="0" y="65" width="180" height="32" rx="16" fill="#112240" stroke="#64ffda" stroke-width="1.5" />
    <text x="16" y="86" class="badge-text">🌾 AGRI-COMMODITIES</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title">Awesome Agriculture Commodity Trading</text>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Curated SaaS Platforms, Market Intelligence, Cash Bids &amp; Open-Source Risk Tools</text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 240)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#172a45" stroke="#233554" />
      <text x="15" y="23" fill="#e6f1ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">📊 Market Data</text>

      <!-- Tag 2 -->
      <rect x="152" y="0" width="150" height="36" rx="8" fill="#172a45" stroke="#233554" />
      <text x="167" y="23" fill="#e6f1ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">🌾 Cash Grain Bids</text>

      <!-- Tag 3 -->
      <rect x="314" y="0" width="160" height="36" rx="8" fill="#172a45" stroke="#233554" />
      <text x="329" y="23" fill="#e6f1ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">📈 Risk Management</text>

      <!-- Tag 4 -->
      <rect x="486" y="0" width="140" height="36" rx="8" fill="#172a45" stroke="#233554" />
      <text x="501" y="23" fill="#e6f1ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">💻 Open Source</text>
    </g>
  </g>
</svg>
